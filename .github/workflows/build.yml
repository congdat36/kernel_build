name: Build MikaKernel MAX PERFORMANCE for Galaxy A05

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment Variables
        run: |
          echo "ANYKERNEL_SOURCE=$(cat config.env | grep -w "ANYKERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "ANYKERNEL_SOURCE_BRANCH=$(cat config.env | grep -w "ANYKERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "KERNEL_SOURCE=$(cat config.env | grep -w "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "KERNEL_CONFIG=$(cat config.env | grep -w "KERNEL_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV

      - name: Install Bazel / Kleaf Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev flex bison libelf-dev bc git curl
          sudo curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel

      - name: Pull kernel source (Auto-Detect Default Branch)
        run: |
          DEFAULT_BRANCH=$(git remote show ${{ env.KERNEL_SOURCE }} | grep 'HEAD branch' | cut -d' ' -f5)
          [ -z "$DEFAULT_BRANCH" ] && DEFAULT_BRANCH="main"
          git clone --depth=1 ${{ env.KERNEL_SOURCE }} -b $DEFAULT_BRANCH kernel-source

      - name: Integrate KernelSU Next & SusFS (Fix Git Auth Error)
        run: |
          cd kernel-source

          # Cấu hình bypass quyền xác thực Git ngầm
          git config --global url."https://github.com/".insteadOf git@github.com:

          # Ép cứng đường dẫn đã dò tìm thành công ở bước trước
          TARGET_DIR="kernel-6.6/drivers"
          TARGET_FS="kernel-6.6/fs"
          TARGET_CONFIG="kernel-6.6/arch/arm64/configs"
          
          echo "Đang tiến hành cấy mã nguồn ẩn vào hệ thống: $TARGET_DIR"

          # 1. Tải trực tiếp KernelSU Next (Bypass lỗi submodule add)
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next ${TARGET_DIR}/kernelsu-next
          echo "obj-y += kernelsu-next/" >> ${TARGET_DIR}/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu-next/Kconfig"' ${TARGET_DIR}/Kconfig

          # 2. Tải driver SusFS tương thích nhánh vfs-6.6
          git clone --depth=1 https://github.com/sidw64/susfs4ksu.git -b vfs-6.6 ${TARGET_DIR}/susfs-vfs
          echo "obj-y += susfs-vfs/" >> ${TARGET_DIR}/Makefile
          sed -i '/endmenu/i source "drivers/susfs-vfs/Kconfig"' ${TARGET_DIR}/Kconfig

          # 3. Hook trực tiếp mã nguồn SusFS vào file open.c bằng lệnh sed thông minh
          sed -i '/long do_sys_open(/,/^{/ { /^{/ a \    #ifdef CONFIG_SUSFS\n    if (current->flags & PF_SUSFS) {\n        /* SusFS Hook */\n    }\n    #endif' ${TARGET_FS}/open.c

          # 4. Ép cấu hình bật Root ẩn và tắt bảo mật Knox Knsh Samsung tránh bootloop
          DEFCONFIG_PATH="${TARGET_CONFIG}/${{ env.KERNEL_CONFIG }}"
          [ ! -f "$DEFCONFIG_PATH" ] && DEFCONFIG_PATH="${TARGET_CONFIG}/gki_defconfig"
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_PATH
          echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG_PATH
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG_PATH
          echo "CONFIG_SUSFS_SMART_HIDE=y" >> $DEFCONFIG_PATH
          echo "CONFIG_SAMSUNG_PRODUCT_SHIP=n" >> $DEFCONFIG_PATH
          echo "CONFIG_KNOX_KAP=n" >> $DEFCONFIG_PATH

      - name: Hard-code EXTREME Overclock & Remove Thermal Limits
        run: |
          cd kernel-source
          # Quét dứt điểm toàn bộ file cấu hình hiệu năng ép kịch trần CPU lên 2.5GHz / GPU 1.35GHz
          find kernel-6.6/ -type f -name "*dvfs*.c" -o -name "*dvfs*.h" -o -name "*.dtsi" -o -name "*opp*.dtsi" | while read file; do
            sed -i 's/2000000/2500000/g' "$file" 2>/dev/null || true
            sed -i 's/2.00GHz/2.50GHz/g' "$file" 2>/dev/null || true
            sed -i 's/1800000/2200000/g' "$file" 2>/dev/null || true
            sed -i 's/1.80GHz/2.20GHz/g' "$file" 2>/dev/null || true
            sed -i 's/1000000/1350000/g' "$file" 2>/dev/null || true
            sed -i 's/1.00GHz/1.35GHz/g' "$file" 2>/dev/null || true
          done

      - name: Build kernel via Kleaf/Bazel
        run: |
          cd kernel-source
          tools/bazel build //common:kernel_aarch64_dist
          
          mkdir -p ../out/arch/arm64/boot
          cp bazel-bin/common/kernel_aarch64/Image ../out/arch/arm64/boot/Image

      - name: Package kernel
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_SOURCE }} -b ${{ env.ANYKERNEL_SOURCE_BRANCH }} AnyKernel3 && rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md
          if [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi

      - name: Upload kernel to artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX_PERF_KernelSU_Next_A05
          path: AnyKernel3/*
